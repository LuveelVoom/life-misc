# B36/S23 pi catalyst search, eater removed (crude INT port of Barrister)
# A = glider + still lifes. B = catalyst region, side L: >= 3 cells from the glider lane
# (lane x-y in [-2,1]; west x-y <= -7, east x-y >= 6), >= 3 cells from existing stills.
rule = "B36/S23"
first-active-range = [20, 70]
active-window-range = [0, 30]
min-stable-interval = 8
max-active-cells = 6
stabilise-results = true
pattern = '''
x = 27, y = 27, rule = LifeHistory
B$2B$3B$4B$5B$6B7.A$7B7.A$8B4.3A$9B$10B$11B$12B$11B$11B3.A$11B2.A.A$11B3.2A$11B8.2A$12B6.A2.A$16B2.A2.A$13B6.2A$13B$11B4.2A2.2A2.2A$11B4.A3.2A3.A$11B2.A.A8.A.A$11B2.2A10.2A$11B7.4B$11B6.6B!
'''
