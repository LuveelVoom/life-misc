# Pi catalyst search, B36/S23 (crude INT port of Barrister).
# A = glider + all still lifes (stills take part in the pi-forming reaction).
# B = catalyst region: east of the glider lane (x-y >= 6, i.e. >= 3 cells from the lane is x-y in [-2,1]),
#     no cell within 2 of an existing still life.
rule = "B36/S23"
first-active-range = [40, 75]
active-window-range = [0, 25]
min-stable-interval = 8
max-active-cells = 10
stabilise-results = true
pattern = '''
x = 29, y = 32, rule = LifeHistory
4.25B$4.25B$4.25B$4.25B$4.25B$4.25B$4.25B$5.24B$.A4.23B$2.A4.22B$3A5.21B$9.8B6.6B$10.7B6.6B$11.4B4.2A2.6B$12.3B4.A3.6B$13.2B2.A.A3.6B$14.B2.2A3.7B$22.7B$21.8B$17.12B$6.A11.11B$5.A.A$6.2A$11.2A$10.A2.A$10.A2.A$11.2A$$7.2A2.2A2.2A$7.A3.2A3.A$5.A.A8.A.A$5.2A10.2A!
'''
