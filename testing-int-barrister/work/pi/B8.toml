# B36/S23 pi catalyst search, eater removed (crude INT port of Barrister)
# A = glider + still lifes. B = catalyst region, side B: >= 3 cells from the glider lane
# (lane x-y in [-2,1]; west x-y <= -7, east x-y >= 6), >= 3 cells from existing stills.
rule = "B36/S23"
first-active-range = [20, 70]
active-window-range = [0, 30]
min-stable-interval = 8
max-active-cells = 8
stabilise-results = true
pattern = '''
x = 36, y = 30, rule = LifeHistory
10.26B$11.25B$12.24B$B12.23B$2B12.22B$3B12.21B$4B12.20B$5B12.19B$6B7.A4.18B$7B7.A4.17B$8B4.3A5.16B$9B12.15B$10B12.14B$11B12.13B$12B12.12B$11B14.11B$11B3.A11.10B$11B2.A.A11.9B$11B3.2A12.8B$11B8.2A8.7B$12B6.A2.A8.6B$16B2.A2.A9.5B$13B6.2A11.4B$13B20.3B$11B4.2A2.2A2.2A9.2B$11B4.A3.2A3.A10.B$11B2.A.A8.A.A$11B2.2A10.2A$11B7.4B$11B6.6B!
'''
